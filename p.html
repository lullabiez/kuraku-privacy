<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Hewan — KuraKu</title>
<style>
:root{--moss:#2E4A31;--moss2:#4C6B4F;--amber:#F2A93B;--bg:#F5F1E8;--surface:#fff;--tp:#20241F;--ts:#5B6459;--line:#E4DDCC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tp);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding:16px;max-width:720px;margin:0 auto}
.hero{display:flex;align-items:center;gap:16px;background:var(--moss);color:#fff;border-radius:20px;padding:18px;margin-bottom:16px}
.avatar{width:72px;height:72px;border-radius:18px;flex:0 0 auto;background:#ffffff22;display:flex;align-items:center;justify-content:center;font-size:36px}
.hero-txt h1{margin:0 0 4px;font-size:22px}
.hero-txt .sub{margin:0;opacity:.9;font-size:14px}
.badge{display:inline-block;margin:8px 0 0;background:var(--amber);color:#3a2a08;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000f}
.card h2{margin:0 0 12px;font-size:16px;color:var(--moss);border-bottom:2px solid var(--line);padding-bottom:8px}
dl{margin:0}
.kv{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--ts);font-size:14px}
.kv dd{margin:0;text-align:right;font-weight:600;font-size:14px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--ts);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.rec{padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec-h{font-weight:600;display:flex;justify-content:space-between;gap:12px}
.rec-h .date{color:var(--ts);font-weight:400;font-size:13px}
.note{color:var(--ts);font-size:13px;margin-top:2px}
.hatch{font-size:13px;margin-top:4px;color:var(--moss2)}
footer{text-align:center;color:var(--ts);font-size:12px;padding:20px 0}
.state{text-align:center;color:var(--ts);padding:48px 16px}
.state h1{color:var(--moss);font-size:20px}
.cta{display:inline-block;margin-top:10px;background:var(--amber);color:#3a2a08;font-weight:700;text-decoration:none;padding:8px 16px;border-radius:999px}
</style>
</head>
<body>
<div id="app"><div class="state"><h1>Memuat profil…</h1></div></div>

<script>
// Jaring pengaman: bila ada error tak tertangani, jangan tampil kosong senyap —
// tampilkan pesannya agar mudah didiagnosis (mis. saat dibuka di browser lama).
window.addEventListener('error', function(ev){
  var el = document.getElementById('app');
  if(el && /Memuat profil/.test(el.textContent||'')){
    el.innerHTML = '<div class="state"><h1>Terjadi kesalahan</h1><p>'
      + String((ev && (ev.message || ev.error)) || 'Tidak diketahui') + '</p></div>';
  }
});

const ID_MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(ms){
  if(ms==null) return '-';
  const d = new Date(Number(ms));
  if(isNaN(d)) return '-';
  return d.getDate()+' '+ID_MONTHS[d.getMonth()]+' '+d.getFullYear();
}

function fmtNum(v){
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : String(n);
}

function ageString(bd){
  if(bd==null) return '-';
  const b = new Date(Number(bd)), now = new Date();
  if(b > now) return '-';
  let y = now.getFullYear()-b.getFullYear();
  let m = now.getMonth()-b.getMonth();
  let d = now.getDate()-b.getDate();
  if(d<0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  const parts = [];
  if(y>0) parts.push(y+' thn');
  if(m>0) parts.push(m+' bln');
  if(y===0) parts.push(d+' hr');
  return parts.length ? parts.join(' ') : '0 hr';
}

function row(label,value){
  return '<div class="kv"><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>';
}

async function decodePayload(frag){
  // Base64 URL-safe (tanpa padding) -> bytes
  let b64 = frag.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  // Raw-deflate -> teks JSON
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const buf = await new Response(stream).arrayBuffer();
  return JSON.parse(new TextDecoder('utf-8').decode(buf));
}

function render(p){
  const unit = p.u || 'g';
  const isLS = unit === 'cm';
  let h = '';

  // Header
  h += '<header class="hero"><div class="avatar">🐾</div><div class="hero-txt">'
    + '<h1>'+esc(p.n)+'</h1>'
    + '<p class="sub">'+[p.c, p.sp, p.m].filter(x=>x&&x.length).map(esc).join(' · ')+'</p>'
    + '<p class="badge">'+esc(p.sx||'-')+'</p></div></header>';

  // Info
  h += '<section class="card"><h2>Info</h2><dl>'
    + row('Spesies', p.sp||'-')
    + row('Morph', p.m||'-')
    + row('Jenis Kelamin', p.sx||'-')
    + row('Tanggal Lahir', fmtDate(p.bd))
    + row('Umur', ageString(p.bd))
    + (p.no ? row('Catatan', p.no) : '')
    + '</dl></section>';

  // Ringkasan
  const w = p.w||[], f = p.f||[], sh = p.sh||[], br = p.br||[];
  h += '<section class="card"><h2>Ringkasan</h2><dl>'
    + row(isLS?'LS Terakhir':'Berat Terakhir', w.length ? (fmtNum(w[0][1])+' '+unit+' · '+fmtDate(w[0][0])) : '-')
    + row('Makan Terakhir', f.length ? (esc(f[0][1])+' '+esc(f[0][2])+' · '+fmtDate(f[0][0])) : '-')
    + row('Shedding Terakhir', sh.length ? fmtDate(sh[0][0]) : '-')
    + row('Kawin Terakhir', br.length ? fmtDate(br[0][0]) : '-')
    + '</dl></section>';

  // Riwayat berat/LS
  if(w.length){
    h += '<section class="card"><h2>'+(isLS?'Riwayat LS':'Riwayat Berat')+'</h2><table><thead><tr><th>Tanggal</th><th>'+unit+'</th></tr></thead><tbody>';
    w.forEach(r => h += '<tr><td>'+fmtDate(r[0])+'</td><td>'+esc(fmtNum(r[1]))+'</td></tr>');
    h += '</tbody></table></section>';
  }
  // Riwayat makan
  if(f.length){
    h += '<section class="card"><h2>Riwayat Makan</h2><table><thead><tr><th>Tanggal</th><th>Pakan</th><th>Ukuran</th></tr></thead><tbody>';
    f.forEach(r => h += '<tr><td>'+fmtDate(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>');
    h += '</tbody></table></section>';
  }
  // Riwayat shedding
  if(sh.length){
    h += '<section class="card"><h2>Riwayat Shedding</h2><table><thead><tr><th>Tanggal</th><th>Status</th></tr></thead><tbody>';
    sh.forEach(r => h += '<tr><td>'+fmtDate(r[0])+'</td><td>'+(r[1]?'Sempurna':'Tidak sempurna')+'</td></tr>');
    h += '</tbody></table></section>';
  }
  // Riwayat kawin + menetas
  if(br.length){
    h += '<section class="card"><h2>Riwayat Kawin</h2>';
    br.forEach(r => {
      h += '<div class="rec"><div class="rec-h">Kawin dengan '+esc(r[1])
        + '<span class="date">'+fmtDate(r[0])+'</span></div>';
      if(r[2]) h += '<div class="note">'+esc(r[2])+'</div>';
      (r[3]||[]).forEach(hh => {
        h += '<div class="hatch">🥚 '+fmtDate(hh[0])+' — '+esc(hh[2])+'/'+esc(hh[1])+' menetas'
          + (hh[3] ? ' · '+esc(hh[3]) : '') + '</div>';
      });
      h += '</div>';
    });
    h += '</section>';
  }

  h += '<footer>Dibuat dengan <b>KuraKu</b> · Jurnal Perawatan Hewan Eksotik · 100% offline<br>'
    + 'Profil ini ditampilkan langsung dari link, tanpa server.</footer>';

  document.getElementById('app').innerHTML = h;
  document.title = p.n + ' — KuraKu';
}

function showError(msg){
  document.getElementById('app').innerHTML =
    '<div class="state"><h1>Profil tidak dapat dibuka</h1><p>'+esc(msg)+'</p>'
    + '<a class="cta" href="https://saweria.co/kurakurakoding">Tentang KuraKu</a></div>';
}

(async function(){
  const frag = location.hash.replace(/^#/, '');
  if(!frag){ showError('Link tidak memuat data profil.'); return; }
  if(typeof DecompressionStream === 'undefined'){
    showError('Browser Anda belum mendukung fitur ini. Coba buka di Chrome/Safari/Firefox versi terbaru.');
    return;
  }
  try{
    const p = await decodePayload(frag);
    render(p);
  }catch(e){
    showError('Data link rusak atau tidak dikenali.');
  }
})();
</script>
</body>
</html>
